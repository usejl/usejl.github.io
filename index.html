<style>
/* =========================================================
   IDENTIDADE VISUAL — troque aqui pelas cores/fontes da marca
   ========================================================= */
:root{
  /* Paleta principal */
  --preto:        #1A1A1A;   /* títulos, logo, textos principais */
  --offwhite:     #F8F6F2;   /* fundo claro */
  --areia:        #E8E0D5;   /* fundos, blocos e detalhes */
  --taupe:        #B6A89A;   /* linhas, ícones, elementos discretos */
  --cafe:         #6D5B4D;   /* destaques elegantes */
  /* Paleta de apoio */
  --salvia:       #AEB7A2;   /* destaques suaves */
  --azul:         #8A97A5;   /* conteúdos editoriais */
  --terracota:    #C98D73;   /* pequenos pontos de atenção */
  --cinza:        #D8D4CF;   /* divisórias e fundos secundários */

  --fundo:        var(--offwhite);
  --cartao:       #FFFFFF;
  --texto:        var(--preto);
  --texto-suave:  var(--cafe);
  --marca:        var(--cafe);
  --marca-escura: var(--cafe);
  --linha:        var(--cinza);
  --esgotado:     var(--taupe);
  --whats:        var(--preto);
  --fonte-titulo: "Tenor Sans", Georgia, serif;
  --fonte-texto:  "DM Sans", system-ui, sans-serif;
  --raio: 4px;
}
/* ========================================================= */

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--fundo);color:var(--texto);font-family:var(--fonte-texto);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}

/* Cabeçalho */
header{position:sticky;top:0;z-index:20;background:rgba(248,246,242,.94);background:color-mix(in srgb,var(--fundo) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo{max-width:1100px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{height:22px;width:auto}
.marca .sub{font-family:var(--fonte-titulo);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--cafe);margin-top:6px}
.marca .wordmark{font-family:var(--fonte-titulo);font-size:26px;font-weight:400;letter-spacing:.35em;color:var(--texto)}
.marca small{display:block;font-size:11px;color:var(--texto-suave);letter-spacing:.08em;text-transform:uppercase}
.acoes-topo{display:flex;gap:6px}
.icone{color:var(--texto);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--linha);background:var(--cartao)}
.icone svg{width:20px;height:20px}

/* Filtros */
.filtros{max-width:1100px;margin:0 auto;padding:4px 16px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;letter-spacing:.04em;border:1px solid var(--linha);background:var(--cartao);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--texto);color:var(--fundo);border-color:var(--texto)}
.busca{max-width:1100px;margin:0 auto;padding:0 16px 12px;display:none}
.busca.aberta{display:block}
.busca input{width:100%;padding:11px 14px;border-radius:999px;border:1px solid var(--linha);background:var(--cartao);font:inherit;outline:none}
.busca input:focus{border-color:var(--marca)}

/* Grade */
main{max-width:1100px;margin:0 auto;padding:16px}
.contagem{font-size:12px;color:var(--texto-suave);margin-bottom:12px;letter-spacing:.04em}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
@media(min-width:720px){.grade{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:1000px){.grade{grid-template-columns:repeat(4,1fr)}}
.card{background:transparent;border-radius:var(--raio);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.98)}
.foto{position:relative;aspect-ratio:3/4;background:var(--areia);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.selo{position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--cartao);color:var(--texto)}
.selo.novo{background:var(--salvia);color:var(--preto)}
.selo.promo{left:auto;right:8px;background:var(--terracota);color:#fff}
.card.esgotado .foto img{filter:grayscale(.9) opacity(.55)}
.card.esgotado .selo.esg{background:var(--esgotado);color:#fff}
.info{padding:10px 2px 6px;display:flex;flex-direction:column;gap:4px}
.nome{font-family:var(--fonte-titulo);font-size:13.5px;font-weight:400;letter-spacing:.02em;line-height:1.3}
.preco{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.preco strong{font-size:15px;font-weight:600}
.preco s{font-size:12px;color:var(--texto-suave)}
.tams{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tams span{font-size:10.5px;padding:2px 6px;border:1px solid var(--linha);border-radius:6px;color:var(--texto-suave)}
.tams span.off{text-decoration:line-through;opacity:.5}
.vazio{text-align:center;color:var(--texto-suave);padding:48px 16px}

/* Detalhe (folha inferior) */
.fundo-escuro{position:fixed;inset:0;background:rgba(20,15,12,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo-escuro.ativo{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--fundo);border-radius:20px 20px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.folha.ativa{transform:none}
@media(min-width:720px){.folha{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:20px;transform:translate(-50%,-45%);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;max-height:90vh}.folha.ativa{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.puxador{width:40px;height:4px;background:var(--linha);border-radius:4px;margin:8px auto 0}
.fechar{position:absolute;top:22px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:var(--cartao);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.galeria{position:relative;z-index:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:8px}
.galeria::-webkit-scrollbar{display:none}
.galeria img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/4;object-fit:cover;max-height:62vh}
.pontos{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.pontos i{width:6px;height:6px;border-radius:50%;background:var(--linha)}
.pontos i.on{background:var(--marca)}
.det{padding:14px 20px 0}
.det .cod{font-size:11px;letter-spacing:.1em;color:var(--texto-suave)}
.det h2{font-family:var(--fonte-titulo);font-size:24px;font-weight:400;letter-spacing:.02em;line-height:1.1;margin:4px 0 8px}
.det .preco strong{font-size:20px}
.det p{color:var(--texto-suave);margin:12px 0}
.rotulo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-suave);margin:16px 0 8px}
.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes button{min-width:46px;padding:9px 12px;border-radius:4px;border:1px solid var(--linha);background:var(--cartao);font-size:14px;font-weight:500}
.opcoes button[aria-pressed="true"]{border-color:var(--texto);background:var(--texto);color:var(--fundo)}
.opcoes button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.aviso{font-size:12px;color:var(--marca-escura);margin-top:8px;min-height:1em}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--fundo);border-top:1px solid var(--linha);display:none;gap:8px}
.barra.ativa{display:flex}
@media(min-width:720px){.barra{left:50%;width:560px;transform:translateX(-50%);bottom:5vh;border-radius:0 0 20px 20px}}
.btn-whats{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:4px;letter-spacing:.04em;background:var(--whats);color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.btn-whats.off{background:var(--esgotado);pointer-events:none}
.btn-whats svg{width:20px;height:20px}
.btn-sec{width:52px;border-radius:4px;border:1px solid var(--linha);background:var(--cartao);display:grid;place-items:center}
.btn-sec svg{width:20px;height:20px}

footer{max-width:1100px;margin:24px auto 0;padding:24px 16px 40px;text-align:center;color:var(--texto-suave);font-size:12.5px;border-top:1px solid var(--linha)}
footer .assinatura{height:44px;margin:0 auto 14px}
footer a{color:var(--marca-escura);font-weight:500;text-decoration:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:10px 16px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<header>
  <div class="topo">
    <div class="marca" id="marca"></div>
    <div class="acoes-topo">
      <button class="icone" id="btnBusca" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <a class="icone" id="btnInsta" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
      </a>
    </div>
  </div>
  <div class="busca" id="busca"><input type="search" id="campoBusca" placeholder="Buscar peça ou código (ex.: JL002)"></div>

<main>
  <div class="contagem" id="contagem"></div>
  <div class="grade" id="grade"></div>
</main>

<footer id="rodape"></footer>

<div class="fundo-escuro" id="fundoEscuro"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-label="Detalhes da peça"></section>
<div class="barra" id="barra">
  <button class="btn-sec" id="btnCompartilhar" aria-label="Compartilhar peça">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/></svg>

  <a class="btn-whats" id="btnWhats" target="_blank" rel="noopener"></a>
</div>
<div class="toast" id="toast"></div>

      <p style="margin-top:6px">Gostou de alguma peça? <a href="https://wa.me/${LOJA.whatsapp}" target="_blank" rel="noopener">Chame no WhatsApp</a> · <a href="https://instagram.com/${LOJA.instagram}" target="_blank" rel="noopener">@${LOJA.instagram}</a></p>
      <p style="margin-top:6px;font-size:11px">Estoque atualizado diariamente. Peças sujeitas à disponibilidade.</p>`;
  }

  function montarFiltros(){
    const usadas = new Set(visiveis().map(p => p.categoria));
    const lista = ["Todas", "Novidades", ...CATEGORIAS.filter(c => usadas.has(c))];
    $("#filtros").innerHTML = lista.map(c => `<button class="chip" data-c="${c}" aria-pressed="${c===categoria}">${c}</button>`).join("");
  }

  function filtrar(){
    const t = termo.trim().toLowerCase();
    return visiveis().filter(p => {
      if (categoria === "Novidades" && !p.novo) return false;
      if (!["Todas","Novidades"].includes(categoria) && p.categoria !== categoria) return false;
      if (t && !(p.nome.toLowerCase().includes(t) || p.codigo.toLowerCase().includes(t) || (p.categoria||"").toLowerCase().includes(t))) return false;
      return true;
    }).sort((a,b) => (disponivel(b) - disponivel(a)) || (b.novo - a.novo));
  }

  function montarGrade(){
    const lista = filtrar();
    const disp = lista.filter(disponivel).length;
    $("#contagem").textContent = lista.length ? `${disp} ${disp===1?"peça disponível":"peças disponíveis"}` : "";
    if (!lista.length){ $("#grade").innerHTML = `<div class="vazio" style="grid-column:1/-1">Nenhuma peça encontrada.</div>`; return; }
    $("#grade").innerHTML = lista.map(p => {
      const ok = disponivel(p);
      const tams = Object.entries(p.tamanhos||{}).map(([t,q]) => `<span class="${q>0?"":"off"}">${t}</span>`).join("");
      return `<button class="card ${ok?"":"esgotado"}" data-cod="${p.codigo}">
        <div class="foto">
          <img loading="lazy" src="${fotosDe(p)[0]}" alt="${p.nome}">
          ${!ok ? `<span class="selo esg">Esgotado</span>` : p.novo ? `<span class="selo novo">Novo</span>` : ""}
          ${ok && p.precoAntigo ? `<span class="selo promo">Promo</span>` : ""}
        </div>
        <div class="info">
          <div class="nome">${p.nome}</div>
          <div class="preco"><strong>${brl(p.preco)}</strong>${p.precoAntigo?`<s>${brl(p.precoAntigo)}</s>`:""}</div>
          <div class="tams">${tams}</div>
        </div>
      </button>`;
    }).join("");
  }

  /* Detalhe */
  function abrir(cod, empurrar=true){
    const p = PRODUTOS.find(x => x.codigo.toLowerCase() === cod.toLowerCase() && x.status !== "oculto");
    if (!p) return;
    atual = p; tamSel = null; corSel = (p.cores && p.cores.length === 1) ? p.cores[0] : null;
    const ok = disponivel(p);
    const fotos = p.fotos && p.fotos.length ? fotosDe(p) : [provisoria(p,0), provisoria(p,1)];
    const tamsDisp = Object.entries(p.tamanhos||{}).filter(([,q]) => q>0);
    if (tamsDisp.length === 1) tamSel = tamsDisp[0][0];
    $("#folha").innerHTML = `
      <div class="puxador"></div>
      <div style="position:sticky;top:0;height:0;z-index:5"><button class="fechar" id="fechar" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="galeria" id="galeria">${fotos.map(f => `<img src="${f}" alt="${p.nome}">`).join("")}</div>
      ${fotos.length>1 ? `<div class="pontos" id="pontos">${fotos.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>` : ""}
      <div class="det">
        <div class="cod">${p.codigo} · ${p.categoria}</div>
        <h2>${p.nome}</h2>
        <div class="preco"><strong>${brl(p.preco)}</strong>${p.precoAntigo?`<s>${brl(p.precoAntigo)}</s>`:""}</div>
        ${p.descricao ? `<p>${p.descricao}</p>` : ""}
        ${p.cores && p.cores.length ? `<div class="rotulo">Cor</div><div class="opcoes" id="cores">${p.cores.map(c=>`<button data-cor="${c}" aria-pressed="${c===corSel}">${c}</button>`).join("")}</div>` : ""}
        <div class="rotulo">Tamanho</div>
        <div class="opcoes" id="tams">${Object.entries(p.tamanhos||{}).map(([t,q])=>`<button data-t="${t}" ${q>0&&ok?"":"disabled"} aria-pressed="${t===tamSel}">${t}</button>`).join("")}</div>
        <div class="aviso" id="aviso">${ok ? (tamsDisp.some(([,q])=>q===1) ? "Últimas unidades em alguns tamanhos" : "") : "Esta peça esgotou. Chame a gente para saber se vai voltar!"}</div>
      </div>`;
    atualizarWhats();
    $("#fundoEscuro").classList.add("ativo");
    $("#folha").classList.add("ativa");
    $("#barra").classList.add("ativa");
    $("#folha").scrollTop = 0;
    document.body.style.overflow = "hidden";
    if (empurrar) history.pushState({cod:p.codigo}, "", "#"+p.codigo);

    $("#fechar").onclick = () => history.back();
    const gal = $("#galeria"), pts = $("#pontos");
    if (pts) gal.addEventListener("scroll", () => {
      const i = Math.round(gal.scrollLeft / gal.clientWidth);
      [...pts.children].forEach((d,k) => d.classList.toggle("on", k===i));
    }, {passive:true});
    $("#tams").onclick = e => { const b = e.target.closest("button[data-t]"); if(!b||b.disabled) return; tamSel = b.dataset.t; [...$("#tams").children].forEach(x=>x.setAttribute("aria-pressed", x===b)); atualizarWhats(); };
    const cs = $("#cores"); if (cs) cs.onclick = e => { const b = e.target.closest("button[data-cor]"); if(!b) return; corSel = b.dataset.cor; [...cs.children].forEach(x=>x.setAttribute("aria-pressed", x===b)); atualizarWhats(); };
  }

  function fechar(){
    atual = null;
    $("#fundoEscuro").classList.remove("ativo");
    $("#folha").classList.remove("ativa");
    $("#barra").classList.remove("ativa");
    document.body.style.overflow = "";
  }

  function linkPeca(p){ return location.href.split("#")[0] + "#" + p.codigo; }

  function atualizarWhats(){
    const p = atual, ok = disponivel(p), b = $("#btnWhats");
    let msg;
    if (ok){
      msg = `${LOJA.mensagemWhats}\n\n*${p.nome}* (${p.codigo})\n${brl(p.preco)}` +
            (tamSel ? `\nTamanho: ${tamSel}` : "") + (corSel ? `\nCor: ${corSel}` : "") +
            `\n\n${linkPeca(p)}`;
      b.innerHTML = WA_ICON + (tamSel ? `Quero no tamanho ${tamSel}` : "Quero essa peça");
    } else {
      msg = `Oi! Vi que a peça *${p.nome}* (${p.codigo}) esgotou. Vai ter reposição?\n\n${linkPeca(p)}`;
      b.innerHTML = WA_ICON + "Avise quando voltar";
    }
    b.classList.remove("off");
    b.href = `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`;
  }

  function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"), 1800); }

  $("#btnCompartilhar").onclick = async () => {
    if (!atual) return;
    const url = linkPeca(atual), texto = `${atual.nome} · ${brl(atual.preco)} — ${LOJA.nome}`;
    try {
      if (navigator.share) { await navigator.share({title:texto, text:texto, url}); return; }
    } catch(e){ if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(url); toast("Link da peça copiado"); } catch(e){ toast(url); }
  };

  /* Eventos */
  $("#filtros").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; categoria = b.dataset.c; montarFiltros(); montarGrade(); window.scrollTo({top:0,behavior:"smooth"}); };
  $("#grade").onclick = e => { const c = e.target.closest(".card"); if (c) abrir(c.dataset.cod); };
  $("#fundoEscuro").onclick = () => history.back();
  $("#btnBusca").onclick = () => { $("#busca").classList.toggle("aberta"); if ($("#busca").classList.contains("aberta")) $("#campoBusca").focus(); };
  $("#campoBusca").oninput = e => { termo = e.target.value; montarGrade(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && atual) history.back(); });
  window.addEventListener("popstate", () => {
    const cod = location.hash.slice(1);
    if (cod) abrir(cod, false); else fechar();
  });

  montarMarca(); montarFiltros(); montarGrade();
  /* Link direto de uma peça: usejl.github.io/#JL002 */
  const inicial = location.hash.slice(1);
  if (inicial) { history.replaceState(null, "", location.pathname); history.pushState({cod:inicial}, "", "#"+inicial); abrir(inicial, false); }
})();
</script>
